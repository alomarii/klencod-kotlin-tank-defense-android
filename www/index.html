<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07110b">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>دفاع الدبابات</title>
<style>
:root{--gold:#ffd54a;--ice:#4fc3f7;--ember:#ff6a2b}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{height:100%;overflow:hidden;background:#07110b;color:#fff;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.gl{background:linear-gradient(180deg,rgba(34,46,62,.8),rgba(10,15,24,.86));border:1px solid rgba(255,255,255,.14);border-radius:14px;backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14)}
#hud{position:fixed;top:max(6px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;gap:8px;align-items:center;pointer-events:none}
.st{padding:6px 12px;font-weight:800;font-size:15px;white-space:nowrap;text-shadow:0 1px 3px #000}
#hpw{flex:1;height:16px;border-radius:9px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);overflow:hidden;min-width:60px}
#hpb{height:100%;width:100%;background:linear-gradient(90deg,#c62828,#ff7043,#ffd54a);transition:width .3s}
.ib{pointer-events:auto;width:42px;height:42px;font-size:19px;display:grid;place-items:center;color:#fff}
.ib:active,.tb:active,.up:active{transform:scale(.93)}
#shop{position:fixed;bottom:max(6px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:6px 8px;max-width:98vw;overflow-x:auto}
.tb{position:relative;width:72px;height:68px;border-radius:12px;border:2px solid #3a4658;background:linear-gradient(180deg,#27323f,#131a24);color:#fff;font:700 11px inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.tb i{font-style:normal;font-size:23px}.tb b{color:var(--gold);font-size:13px}
.tb.on{border-color:var(--ice);box-shadow:0 0 16px var(--ice);background:linear-gradient(180deg,#25465a,#122332)}
.tb.off{opacity:.42}
.tb em{position:absolute;top:3px;left:4px;font:700 10px inherit;font-style:normal;color:var(--ice)}
#panel{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:none;gap:8px;padding:8px;z-index:5}
.up{width:92px;padding:8px 4px;border-radius:12px;border:2px solid #3a4658;background:linear-gradient(180deg,#27323f,#131a24);color:#fff;font:700 12px inherit;text-align:center}
.up b{display:block;color:var(--gold);margin-top:3px}.up.sell{border-color:#c0392b}.up.max{opacity:.45}
#toast{position:fixed;top:22%;left:50%;transform:translateX(-50%);padding:10px 22px;font-size:22px;font-weight:900;display:none;white-space:nowrap;text-shadow:0 0 14px currentColor}
#toast.boss{color:var(--ember);animation:bp .5s infinite alternate}@keyframes bp{to{transform:translateX(-50%) scale(1.1)}}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,rgba(20,50,30,.82),rgba(3,8,5,.96));text-align:center;z-index:9}
.ov h1{font-size:clamp(34px,8vw,64px);font-weight:900;letter-spacing:-.02em;background:linear-gradient(180deg,#fff2b0,#ffb300 55%,#ff6a2b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 12px rgba(255,120,0,.45))}
.ov p{opacity:.85;font-size:16px;line-height:1.7}
.go{padding:14px 44px;border:0;border-radius:16px;font:900 20px inherit;color:#1b1200;background:linear-gradient(180deg,#ffe27a,#ffb300);box-shadow:0 0 28px rgba(255,170,0,.5),inset 0 -4px 0 rgba(0,0,0,.2)}
.go:active{transform:scale(.96)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
 <div class="gl st">🪙 <span id="g">0</span></div>
 <div class="gl st">🎯 <span id="w">1</span></div>
 <div class="gl st">🏗️ <span id="tc">0/8</span></div>
 <div id="hpw"><div id="hpb"></div></div>
 <button class="gl ib" id="bp">⏸</button><button class="gl ib" id="bs">1×</button><button class="gl ib" id="bm">🔊</button>
</div>
<div id="toast" class="gl"></div>
<div id="panel" class="gl"></div>
<div id="shop" class="gl"></div>
<div class="ov" id="start"><h1>دفاع الدبابات</h1><p>اختر برجاً ثم المس الخريطة أو اسحب لوضعه<br>المس البرج للترقية أو البيع<br><span id="bestS"></span></p><button class="go" id="goS">ابدأ المعركة</button></div>
<div class="ov" id="over" style="display:none"><h1>سقطت القاعدة</h1><p id="ovT"></p><button class="go" id="goR">إعادة اللعب</button></div>
<script src="game.js"></script>
</body>
</html>
